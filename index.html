<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Test</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; }
    #time { font-size: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>Codex Test 성공!</h1>
    <p id="time"></p>
    <p>GitHub 연결 테스트 완료</p>
  </main>
  <script>
    const time = document.querySelector('#time');
    function updateTime() {
      time.textContent = `현재 시간: ${new Date().toLocaleString('ko-KR')}`;
    }
    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
